<!-- Diwali fireworks overlay: add once, just before the closing </body> tag. -->
<div class="hamptons-diwali-fireworks" aria-hidden="true">
  <canvas class="hamptons-diwali-fireworks__canvas"></canvas>
</div>

<style>
  .hamptons-diwali-fireworks {
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    overflow: hidden;
    pointer-events: none;
    background: transparent;
    opacity: 0;
    transition: opacity .5s ease;
    will-change: opacity;
  }

  .hamptons-diwali-fireworks.is-active {
    opacity: 1;
  }

  .hamptons-diwali-fireworks.is-leaving {
    opacity: 0;
    transition-duration: 1.15s;
  }

  .hamptons-diwali-fireworks__canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  @media (prefers-reduced-motion: reduce) {
    .hamptons-diwali-fireworks { display: none; }
  }
</style>

<script>
  (() => {
    const root = document.querySelector('.hamptons-diwali-fireworks');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Change this value to control how long a visitor waits before seeing the animation again.
    const COOLDOWN_MS = 24 * 60 * 60 * 1000; // 24 hours
    const STORAGE_KEY = 'hamptons-diwali-fireworks-last-seen-v2';
    const COOKIE_KEY = 'hamptons_diwali_fireworks_seen';

    const readStorageTimestamp = (storage) => {
      try {
        return Number(storage.getItem(STORAGE_KEY)) || 0;
      } catch (error) {
        return 0;
      }
    };

    const getCookieTimestamp = () => {
      try {
        const cookie = document.cookie.split('; ').find((item) => item.startsWith(`${COOKIE_KEY}=`));
        return cookie ? Number(cookie.split('=')[1]) || 0 : 0;
      } catch (error) {
        return 0;
      }
    };

    const getLastSeen = () => {
      return readStorageTimestamp(window.localStorage)
        || getCookieTimestamp()
        || readStorageTimestamp(window.sessionStorage);
    };

    const saveLastSeen = (timestamp) => {
      try {
        window.localStorage.setItem(STORAGE_KEY, String(timestamp));
      } catch (error) {}
      try {
        window.sessionStorage.setItem(STORAGE_KEY, String(timestamp));
      } catch (error) {}
      try {
        document.cookie = `${COOKIE_KEY}=${timestamp}; max-age=${Math.ceil(COOLDOWN_MS / 1000)}; path=/; SameSite=Lax`;
      } catch (error) {}
    };

    const lastSeen = getLastSeen();
    const elapsedSinceLastSeen = Date.now() - lastSeen;
    const isInCooldown = lastSeen && elapsedSinceLastSeen >= 0 && elapsedSinceLastSeen < COOLDOWN_MS;

    if (!root || window.__hamptonsDiwaliFireworks || reducedMotion || isInCooldown) {
      if (root && (reducedMotion || isInCooldown)) root.remove();
      return;
    }
    window.__hamptonsDiwaliFireworks = true;

    const canvas = root.querySelector('canvas');
    const context = canvas.getContext('2d', { alpha: true, desynchronized: true });
    const rockets = [];
    const sparks = [];
    const palette = [
      ['#fff0a5', '#ffb000', '#ff5c35'],
      ['#ffd0e0', '#ff3d81', '#ff7b00'],
      ['#c9f4ff', '#2db8ff', '#5c61ff'],
      ['#f0d2ff', '#b05cff', '#ff4fd8'],
      ['#d6ffd0', '#35dc85', '#baff3d']
    ];
    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let lastFrame = 0;
    let animationFrame;
    let stopped = false;
    let maxSparks = 520;

    const random = (min, max) => Math.random() * (max - min) + min;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    const resize = () => {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      width = window.innerWidth;
      height = window.innerHeight;
      maxSparks = width < 600 ? 280 : 520;
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    };

    const launch = (targetX, targetY, colors, delay = 0) => {
      window.setTimeout(() => {
        if (stopped) return;
        const startX = clamp(targetX + random(-width * .12, width * .12), width * .08, width * .92);
        const startY = height + 24;
        rockets.push({
          x: startX,
          y: startY,
          startX,
          startY,
          targetX,
          targetY,
          duration: random(820, 1120),
          elapsed: 0,
          color: colors[0],
          colors
        });
      }, delay);
    };

    const makeSpark = (rocket, angle, speed, life, size, color, gravity, friction, twinkle) => {
      if (sparks.length >= maxSparks) return;
      sparks.push({
        x: rocket.targetX,
        y: rocket.targetY,
        px: rocket.targetX,
        py: rocket.targetY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity,
        friction,
        life,
        maxLife: life,
        size,
        color,
        twinkle,
        trail: [],
        trailLength: Math.round(random(6, 12))
      });
    };

    const explode = (rocket) => {
      const particleCount = width < 600 ? 42 : 70;
      const coreSize = width < 600 ? 1.45 : 2;
      for (let index = 0; index < particleCount; index += 1) {
        const angle = (Math.PI * 2 * index) / particleCount + random(-.07, .07);
        const speed = random(2, 5.9) * (index % 7 === 0 ? 1.3 : 1);
        makeSpark(
          rocket, angle, speed, random(1050, 1850), random(coreSize, coreSize + 1.75),
          rocket.colors[Math.floor(Math.random() * rocket.colors.length)],
          random(.019, .035), random(.981, .992), Math.random() > .38
        );
      }
      for (let index = 0; index < 14; index += 1) {
        makeSpark(rocket, random(0, Math.PI * 2), random(.25, 1.4), random(240, 460), random(2, 3.7), '#fff6cc', .008, .96, true);
      }
    };

    const drawRocket = (rocket, delta) => {
      rocket.elapsed += delta;
      const progress = Math.min(rocket.elapsed / rocket.duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const previousX = rocket.x;
      const previousY = rocket.y;
      rocket.x = rocket.startX + (rocket.targetX - rocket.startX) * eased;
      rocket.y = rocket.startY + (rocket.targetY - rocket.startY) * eased;

      context.strokeStyle = rocket.color;
      context.globalAlpha = Math.min(1, progress * 4) * .75;
      context.lineWidth = 1.45;
      context.beginPath();
      context.moveTo(previousX, previousY);
      context.lineTo(rocket.x, rocket.y);
      context.stroke();
      context.fillStyle = '#fff6d8';
      context.globalAlpha = Math.min(1, progress * 4);
      context.beginPath();
      context.arc(rocket.x, rocket.y, 2.15, 0, Math.PI * 2);
      context.fill();
      return progress >= 1;
    };

    const drawSpark = (spark, delta) => {
      spark.life -= delta;
      if (spark.life <= 0) return true;
      spark.trail.unshift({ x: spark.x, y: spark.y });
      if (spark.trail.length > spark.trailLength) spark.trail.pop();
      spark.px = spark.x;
      spark.py = spark.y;
      const timeScale = delta / 16.67;
      spark.vx *= Math.pow(spark.friction, timeScale);
      spark.vy = spark.vy * Math.pow(spark.friction, timeScale) + spark.gravity * timeScale;
      spark.x += spark.vx * timeScale;
      spark.y += spark.vy * timeScale;
      const lifeRatio = spark.life / spark.maxLife;
      const flicker = spark.twinkle ? random(.58, 1) : 1;

      context.globalAlpha = Math.pow(lifeRatio, .58) * flicker;
      context.strokeStyle = spark.color;
      context.lineCap = 'round';
      context.lineWidth = Math.max(.75, spark.size * lifeRatio);
      context.beginPath();
      context.moveTo(spark.x, spark.y);
      spark.trail.forEach((point) => context.lineTo(point.x, point.y));
      context.stroke();
      context.fillStyle = spark.color;
      context.beginPath();
      context.arc(spark.x, spark.y, spark.size * lifeRatio, 0, Math.PI * 2);
      context.fill();
      return false;
    };

    const animate = (now) => {
      if (stopped) return;
      const delta = Math.min(32, now - (lastFrame || now));
      lastFrame = now;
      context.clearRect(0, 0, width, height);
      context.globalCompositeOperation = 'lighter';

      for (let index = rockets.length - 1; index >= 0; index -= 1) {
        if (drawRocket(rockets[index], delta)) {
          explode(rockets[index]);
          rockets.splice(index, 1);
        }
      }
      for (let index = sparks.length - 1; index >= 0; index -= 1) {
        if (drawSpark(sparks[index], delta)) sparks.splice(index, 1);
      }
      context.globalAlpha = 1;
      context.globalCompositeOperation = 'source-over';
      animationFrame = requestAnimationFrame(animate);
    };

    const show = () => {
      saveLastSeen(Date.now());
      resize();
      root.classList.add('is-active');
      const sequence = [
        [.17, .26, 180], [.83, .28, 430], [.48, .17, 700], [.30, .37, 980],
        [.68, .35, 1240], [.11, .48, 1510], [.89, .46, 1720], [.51, .30, 2010],
        [.24, .22, 2320], [.76, .22, 2570], [.42, .43, 2850], [.60, .42, 3100],
        [.16, .33, 3440], [.85, .34, 3720], [.49, .16, 4060], [.31, .27, 4470],
        [.70, .27, 4760], [.50, .35, 5150], [.22, .19, 5550], [.80, .20, 5840]
      ];
      sequence.forEach(([x, y, delay], index) => launch(width * x, height * y, palette[index % palette.length], delay));
      animationFrame = requestAnimationFrame(animate);
      window.setTimeout(() => root.classList.add('is-leaving'), 8100);
      window.setTimeout(() => {
        stopped = true;
        cancelAnimationFrame(animationFrame);
        window.removeEventListener('resize', resize);
        root.remove();
      }, 9400);
    };

    window.addEventListener('resize', resize, { passive: true });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, { once: true });
    else show();
  })();
</script>
