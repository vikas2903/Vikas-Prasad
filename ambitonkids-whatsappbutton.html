<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Glow Button</title>
  <style>
    :root {
      --wa-green: #25d366;
      --wa-green-dark: #128c4a;
      --wa-wave: rgba(37, 211, 102, 0.35);
      --wa-wave-soft: rgba(37, 211, 102, 0.18);
    }


    .wa-wrap {
      text-align: center;
    }

    .wa-label {
      margin: 0 0 18px;
      font-size: 14px;
      color: #1f2937;
    }

    .wa-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--wa-green), var(--wa-green-dark));
      box-shadow: 0 12px 28px rgba(18, 140, 74, 0.28);
      text-decoration: none;
      overflow: visible;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .wa-button::before,
    .wa-button::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--wa-wave);
      animation: wave 2.4s infinite;
    }

    .wa-button::after {
      border-color: var(--wa-wave-soft);
      animation-delay: 1.2s;
    }

    .wa-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 34px rgba(18, 140, 74, 0.34);
    }

    .wa-button:focus-visible {
      outline: 3px solid rgba(37, 211, 102, 0.3);
      outline-offset: 6px;
    }

    .wa-icon {
      width: 18px;
      height: 18px;
      display: block;
      fill: #ffffff;
      position: relative;
      z-index: 1;
    }

    .wa-note {
      margin: 16px 0 0;
      font-size: 13px;
      color: #5b6675;
    }

    @keyframes wave {
      0% {
        transform: scale(1);
        opacity: 0.9;
      }
      70% {
        transform: scale(1.8);
        opacity: 0;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="wa-wrap">

    <a
      class="wa-button"
      href="https://chat.whatsapp.com/KlsjoO6p5B7CETXdyqLegW?mode=gi_t"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open WhatsApp"
    >
