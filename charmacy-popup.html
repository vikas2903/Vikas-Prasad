
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #61101a;
        background: transparent;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }


      .modal-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        overflow-y: auto;
        place-items: center;
        padding: 8px;
        background: transparent;
      }

      .modal-backdrop[hidden] {
        display: none;
      }

      .rewards-modal {
        position: relative;
        width: min(100%, 400px);
        padding: 36px 24px 20px;
        background: transparent;
        animation: rise-in 320ms cubic-bezier(.2, .75, .25, 1) both;
      }

      .close-button {
        position: absolute;
        top: 14px;
        right: 14px;
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgb(97 16 26 / 28%);
        border-radius: 50%;
        background: transparent;
        color: #61101a;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .close-button:hover {
        transform: rotate(90deg);
        border-color: #8b5a16;
        background: rgb(97 16 26 / 8%);
      }

      .close-button:focus-visible {
        outline: 2px solid #fff3d4;
        outline-offset: 3px;
      }

      .close-button svg {
        width: 17px;
        height: 17px;
      }

      .offer-copy {
        margin: 0;
        color: #61101a;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(16px, 3.8vw, 18px);
        line-height: 1.45;
        text-align: center;
        text-wrap: pretty;
      }

      .offer-copy p {
        margin: 0;
      }

      .offer-copy p + p {
        margin-top: 10px;
      }

      .offer-copy strong {
        color: #8b5a16;
        font-weight: 600;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes rise-in {
        from { transform: translateY(12px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @media (max-width: 520px) {
        .modal-backdrop {
          padding: 8px;
        }

        .rewards-modal {
          padding: 36px 20px 16px;
        }

        .offer-copy {
          font-size: 18px;
          line-height: 1.4;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  

    <div class="modal-backdrop" id="rewards-backdrop" hidden>
      <section
        class="rewards-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Charm Points offer"
      >
        <button class="close-button" id="close-rewards" type="button" aria-label="Close Charm Points offer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="offer-copy">
          <p>Earn <strong>5% Charm Points*</strong> on your total order value.</p>
          <p>Redeem your Charm points on any purchase after 7 days of credit.</p>
          <p>Charm Points are credited once your order is paid or delivered and remain valid for 90 days.</p>
        </div>
      </section>
    </div>

    <script>
      (() => {
        const storageKey = "charmacy-charm-points-dismissed-date";
        const backdrop = document.getElementById("rewards-backdrop");
        const closeButton = document.getElementById("close-rewards");

        function localDateKey(date) {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, "0");
          const day = String(date.getDate()).padStart(2, "0");
          return `${year}-${month}-${day}`;
        }

        function dismiss() {
          backdrop.hidden = true;
          document.body.style.overflow = "";

          try {
            localStorage.setItem(storageKey, localDateKey(new Date()));
          } catch (error) {
            console.error("Could not save today's Charm Points popup dismissal.", error);
          }
        }

        let dismissedToday = false;
        try {
          dismissedToday = localStorage.getItem(storageKey) === localDateKey(new Date());
        } catch (error) {
          console.error("Could not check today's Charm Points popup dismissal.", error);
        }

        if (!dismissedToday) {
          window.setTimeout(() => {
            backdrop.hidden = false;
            document.body.style.overflow = "hidden";
            closeButton.focus();
          }, 3500);
        }

        closeButton.addEventListener("click", dismiss);

        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) {
            dismiss();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (backdrop.hidden) return;

          if (event.key === "Escape") {
            dismiss();
          }
        });
      })();
    </script>
